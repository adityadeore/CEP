<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Announcement Management – Rural Connect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/chatbot.css">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/theme.js"></script></head>
<body class="admin-shell"><nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="../index.html">Rural Connect</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="announcements.html">Announcements</a></li><li class="nav-item"><a class="nav-link" href="alerts.html">Emergency Alerts</a></li><li class="nav-item"><a class="nav-link" href="agriculture.html">Agriculture</a></li><li class="nav-item"><a class="nav-link" href="market-management.html">Market</a></li><li class="nav-item"><a class="nav-link" href="fleet.html">Fleet</a></li></ul><ul class="navbar-nav" id="auth-nav-links"></ul></div></div></nav>
<main class="container py-5"><div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4"><div><span class="rc-section-kicker">COMMUNITY UPDATES</span><h1 class="section-title mb-1">Village Announcements</h1><p class="text-muted mb-0">Create, edit and remove announcements that appear across Rural Connect.</p></div><button class="btn btn-primary-rural" id="addBtn">+ Add New</button></div><div id="message" class="mb-3"></div><div class="card"><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Title</th><th>Message</th><th>Location</th><th class="text-end">Actions</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="text-center text-muted">Loading...</td></tr></tbody></table></div></div></div></main>
<div class="modal fade" id="editor" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5" id="editorTitle">Add New</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><form id="form"><div class="modal-body"><input type="hidden" id="itemId"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="f-title">Title</label><input class="form-control" id="f-title" type="text"></div><div class="col-12"><label class="form-label" for="f-message">Message</label><textarea class="form-control" id="f-message" rows="4"></textarea></div><div class="col-md-6"><label class="form-label" for="f-location">Location</label><input class="form-control" id="f-location" type="text"></div></div><div id="formMsg" class="small mt-3"></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary-rural">Save</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/config.js"></script><script src="../js/api.js"></script><script>
if(!isAdmin()) window.location.href='../login.html';
const modal=new bootstrap.Modal(document.getElementById('editor'));let items=[];
const FIELDS=["title", "message", "location"];
function render(){const body=document.getElementById('rows'); if(!items.length){body.innerHTML='<tr><td colspan="4" class="text-center text-muted py-4">No records found.</td></tr>';return;} body.innerHTML=items.map(x=>`<tr><td>\${escapeHtml(x.title||"—")}</td><td>\${escapeHtml(truncateText(x.message||"",90))}</td><td>\${escapeHtml(x.location||"—")}</td><td class="text-end"><button class="btn btn-sm btn-outline-primary me-1" onclick="editItem('${escapeHtml(x._id)}')">Edit</button><button class="btn btn-sm btn-outline-danger" onclick="removeItem('${escapeHtml(x._id)}')">Delete</button></td></tr>`).join('');}
async function load(){try{items=await fetchAnnouncements();render();}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="4" class="text-danger text-center">${escapeHtml(e.message)}</td></tr>`;}}
function resetForm(){document.getElementById('form').reset();document.getElementById('itemId').value='';document.getElementById('editorTitle').textContent='Add New';document.getElementById('formMsg').textContent='';}
function editItem(id){const x=items.find(v=>String(v._id)===String(id));if(!x)return;document.getElementById('itemId').value=x._id;FIELDS.forEach(k=>{const el=document.getElementById('f-'+k);if(el)el.value=x[k]??'';});document.getElementById('editorTitle').textContent='Edit';modal.show();}
async function removeItem(id){if(!confirm('Delete this record?'))return;try{await deleteAnnouncement(id);await load();}catch(e){alert(e.message);}}
document.getElementById('addBtn').onclick=()=>{resetForm();modal.show();};
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const payload={};FIELDS.forEach(k=>payload[k]=document.getElementById('f-'+k).value.trim());payload.isActive=true;try{const id=document.getElementById('itemId').value;if(id)await updateAnnouncement(id,payload);else await addAnnouncement(payload);modal.hide();await load();}catch(err){document.getElementById('formMsg').className='small mt-3 text-danger';document.getElementById('formMsg').textContent=err.message;}};load();
</script><script src="../js/language.js"></script><script src="../js/chatbot.js"></script></body></html>
