<body class="admin-shell">
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#1b5e20;">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Rural Connect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html" data-i18n="dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="users.html">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="complaints.html">Complaints</a></li><li class="nav-item"><a class="nav-link" href="announcements.html">Announcements</a></li><li class="nav-item"><a class="nav-link" href="alerts.html">Emergency Alerts</a></li><li class="nav-item"><a class="nav-link" href="agriculture.html">Agriculture</a></li><li class="nav-item"><a class="nav-link" href="market-management.html">Market</a></li>
        </ul>
        <ul class="navbar-nav" id="auth-nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container" style="margin-top:40px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <div><span class="rc-section-kicker">ACCESS CONTROL</span><h2 class="section-title mb-1">User Management</h2><p class="text-muted mb-0">Assign roles such as Admin, User or Market Person.</p></div>
    </div>
    <div class="card"><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Email</th><th>Location</th><th>Role</th><th>Action</th></tr></thead><tbody id="users-list"><tr><td colspan="5" class="text-muted text-center">Loading users...</td></tr></tbody></table></div></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
if (!isAdmin()) window.location.href = '../login.html';

async function loadUsers(){
  const container=document.getElementById('users-list');
  try{
    const users=await apiRequest('/users');
    container.innerHTML=(users||[]).map(u=>`<tr>
      <td><strong>${escapeHtml(u.name)}</strong></td>
      <td>${escapeHtml(u.email)}</td>
      <td>${escapeHtml([u.village,u.district,u.state].filter(Boolean).join(', ')||'—')}</td>
      <td><select class="form-select form-select-sm" id="role-${escapeHtml(u._id)}" ${String(u.role)==='admin'?'disabled':''}>
        <option value="user" ${u.role==='user'?'selected':''}>User</option>
        <option value="market" ${u.role==='market'?'selected':''}>Market Person</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
      </select></td>
      <td><button class="btn btn-sm btn-primary-rural" ${String(u.role)==='admin'?'disabled':''} onclick="saveRole('${escapeHtml(u._id)}')">Save Role</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="text-muted text-center">No users found.</td></tr>';
  }catch(err){container.innerHTML=`<tr><td colspan="5" class="text-danger text-center">${escapeHtml(err.message)}</td></tr>`;}
}
async function saveRole(id){
  const role=document.getElementById('role-'+id).value;
  try{await updateUser(id,{role});await loadUsers();}catch(err){alert(err.message);}
}
loadUsers();
</script>
  <script src="../js/language.js"></script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
