<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agriculture Information – Rural Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/chatbot.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#1b5e20;">
    <div class="container"><a class="navbar-brand" href="index.html">Rural Connect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="index.html" data-i18n="home">Home</a></li><li class="nav-item"><a class="nav-link" href="schemes.html" data-i18n="schemes">Schemes</a></li></ul><ul class="navbar-nav" id="auth-nav-links"></ul></div>
    </div>
  </nav>

  <div class="container" style="margin-top:40px;">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4"><div><span class="rc-section-kicker">FARMER SUPPORT</span><h2 class="section-title mb-1">Agriculture Information</h2><p class="text-muted mb-0">Practical, easy-to-read information for crops and seasons.</p></div></div>
    <div class="card mb-4"><div class="card-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Search</label><input id="agriSearch" class="form-control" placeholder="Crop, topic or keyword"></div><div class="col-md-4"><label class="form-label">Category</label><select id="agriCategory" class="form-select"><option value="">All categories</option><option>Crop info</option><option>Pest/disease</option><option>Irrigation</option><option>Soil</option><option>General</option></select></div><div class="col-md-2 d-flex align-items-end"><button id="agriBtn" class="btn btn-primary-rural w-100">Search</button></div></div></div></div>
    <div id="agri-list" class="row g-4"></div>
  </div>

  <footer><div class="container"><div class="text-center"><small>&copy; 2026 Rural Connect.</small></div></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
async function loadAgriculture(){try{const params={active:'true',limit:50};const search=document.getElementById('agriSearch').value.trim();const category=document.getElementById('agriCategory').value;if(search)params.search=search;if(category)params.category=category;const items=await fetchAgriculture(params);const c=document.getElementById('agri-list');if(!items||!items.length){c.innerHTML='<div class="col-12"><div class="alert alert-light border">No agriculture information found.</div></div>';return;}c.innerHTML=items.map(i=>`<div class="col-md-6"><article class="card h-100"><div class="card-body"><span class="badge text-bg-light mb-2">${escapeHtml(i.category||'Agriculture')}</span><h5>${escapeHtml(i.title)}</h5><p class="text-muted mb-2"><strong>${escapeHtml(i.crop||'General')}</strong> · ${escapeHtml(i.season||'All Season')}</p><p class="mb-0">${escapeHtml(i.content||'')}</p></div></article></div>`).join('');}catch(err){document.getElementById('agri-list').innerHTML=`<div class="col-12"><p class="text-danger">${escapeHtml(err.message)}</p></div>`;}}
document.getElementById('agriBtn').onclick=loadAgriculture;document.getElementById('agriSearch').addEventListener('keydown',e=>{if(e.key==='Enter')loadAgriculture();});loadAgriculture();
  </script>
  <script src="js/language.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
