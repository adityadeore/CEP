<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Information – Rural Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/chatbot.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#1b5e20;">
    <div class="container"><a class="navbar-brand" href="index.html">Rural Connect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="index.html" data-i18n="home">Home</a></li><li class="nav-item"><a class="nav-link" href="schemes.html" data-i18n="schemes">Schemes</a></li></ul><ul class="navbar-nav" id="auth-nav-links"></ul></div>
    </div>
  </nav>

  <div class="container" style="margin-top:40px;">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4"><div><span class="rc-section-kicker">LOCAL MARKETS</span><h2 class="section-title mb-1">Market Prices</h2><p class="text-muted mb-0">Latest prices published by Rural Connect administrators and authorized market persons.</p></div><a id="marketManage" class="btn btn-outline-primary d-none" href="admin/market-management.html">Manage Market Data</a></div>
    <div class="card mb-4"><div class="card-body"><div class="row g-3"><div class="col-md-5"><label class="form-label">Crop</label><input type="text" class="form-control" id="crop" placeholder="e.g. Wheat"></div><div class="col-md-5"><label class="form-label">Market</label><input type="text" class="form-control" id="market" placeholder="e.g. Nashik Mandi"></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary-rural w-100" id="search-btn">Search</button></div></div></div></div>
    <div id="marketCards" class="row g-4"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
function showMarketManager(){const u=getUser();if(u&&(u.role==='admin'||u.role==='market'))document.getElementById('marketManage').classList.remove('d-none');}
async function loadMarket(){const crop=document.getElementById('crop').value.trim(), market=document.getElementById('market').value.trim(), params={};if(crop)params.crop=crop;if(market)params.market=market;try{const items=await fetchMarket(params);const c=document.getElementById('marketCards');if(!items||!items.length){c.innerHTML='<div class="col-12"><div class="alert alert-light border">No market prices found.</div></div>';return;}c.innerHTML=items.map(i=>`<div class="col-md-6 col-xl-4"><article class="card h-100"><div class="card-body"><div class="d-flex justify-content-between gap-2"><div><span class="badge text-bg-light">${escapeHtml(i.market||'Market')}</span><h5 class="mt-2 mb-1">${escapeHtml(i.crop||'Crop')}</h5></div><span class="fw-bold text-success">₹${escapeHtml(i.price??'—')}</span></div><p class="text-muted mb-1">Unit: ${escapeHtml(i.unit||'')}</p><p class="text-muted mb-1">Location: ${escapeHtml(i.location||'')}</p><small>Updated: ${i.date?new Date(i.date).toLocaleDateString():'—'} · ${escapeHtml(i.source||'Rural Connect')}</small></div></article></div>`).join('');}catch(err){document.getElementById('marketCards').innerHTML=`<div class="col-12"><p class="text-danger">${escapeHtml(err.message)}</p></div>`;}}
document.getElementById('search-btn').addEventListener('click',loadMarket);document.getElementById('crop').addEventListener('keydown',e=>{if(e.key==='Enter')loadMarket();});document.getElementById('market').addEventListener('keydown',e=>{if(e.key==='Enter')loadMarket();});showMarketManager();loadMarket();
  </script>
  <script src="js/language.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
